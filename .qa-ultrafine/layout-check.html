<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UltraFine Mobile Layout Check</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
      font-family: Arial, sans-serif;
    }
    iframe {
      display: block;
      width: 390px;
      height: 844px;
      border: 0;
    }
    pre {
      margin: 0;
      padding: 16px;
      white-space: pre-wrap;
      font: 12px/1.45 Consolas, monospace;
    }
  </style>
</head>
<body>
  <iframe id="page" src="../airclean-ultrafine/index.html" title="UltraFine"></iframe>
  <pre id="out">Loading...</pre>
  <script>
    const iframe = document.getElementById("page");
    const out = document.getElementById("out");

    function shortSelector(element) {
      if (!element || !element.tagName) {
        return "unknown";
      }

      const parts = [element.tagName.toLowerCase()];
      if (element.id) {
        parts.push(`#${element.id}`);
      }

      const classList = Array.from(element.classList || []).slice(0, 4);
      if (classList.length) {
        parts.push(`.${classList.join(".")}`);
      }

      return parts.join("");
    }

    iframe.addEventListener("load", () => {
      const win = iframe.contentWindow;
      const doc = win.document;
      const viewportWidth = win.innerWidth;
      const viewportHeight = win.innerHeight;
      const blockSelectors = [
        ".ultrafine-brochure-copy",
        ".ultrafine-brochure-visual",
        ".ultrafine-stat",
        ".ultrafine-issues-shell",
        ".ultrafine-app-carousel",
        ".ultrafine-metric",
        ".checked-list-success",
        ".ultrafine-media",
        ".ultrafine-video-callout",
        ".ultrafine-video-free",
        ".ultrafine-proof-card",
        ".ultrafine-sustain-media",
        ".ultrafine-shop-shell",
        ".ultrafine-product-card"
      ];

      function isVisible(element) {
        const style = win.getComputedStyle(element);
        if (style.display === "none" || style.visibility === "hidden" || style.opacity === "0") {
          return false;
        }

        const rect = element.getBoundingClientRect();
        return rect.width > 8 && rect.height > 8;
      }

      function overlaps(rectA, rectB) {
        return !(
          rectA.right <= rectB.left ||
          rectA.left >= rectB.right ||
          rectA.bottom <= rectB.top ||
          rectA.top >= rectB.bottom
        );
      }

      function isParentChild(a, b) {
        return a.contains(b) || b.contains(a);
      }

      async function runChecks() {
        const maxScroll = Math.max(0, doc.documentElement.scrollHeight - viewportHeight);
        const steps = [];
        for (let y = 0; y <= maxScroll; y += 260) {
          steps.push(y);
        }
        if (steps[steps.length - 1] !== maxScroll) {
          steps.push(maxScroll);
        }

        const visibleOverflow = [];
        const visibleOverlaps = [];
        const overfullBlocks = [];

        for (const y of steps) {
          win.scrollTo(0, y);
          await new Promise((resolve) => setTimeout(resolve, 30));

          const viewportElements = Array.from(doc.querySelectorAll("body *")).filter((element) => {
            if (!isVisible(element)) {
              return false;
            }

            if (shortSelector(element).includes("VIpgJd")) {
              return false;
            }

            const rect = element.getBoundingClientRect();
            return rect.bottom > 0 && rect.top < viewportHeight;
          });

          viewportElements.forEach((element) => {
            const rect = element.getBoundingClientRect();
            const style = win.getComputedStyle(element);
            if (rect.left < -1 || rect.right > viewportWidth + 1) {
              visibleOverflow.push({
                y,
                selector: shortSelector(element),
                left: Math.round(rect.left),
                right: Math.round(rect.right),
                width: Math.round(rect.width),
                position: style.position
              });
            }
          });

          const blocks = Array.from(doc.querySelectorAll(blockSelectors.join(","))).filter((element) => {
            if (!isVisible(element)) {
              return false;
            }
            const rect = element.getBoundingClientRect();
            return rect.bottom > 0 && rect.top < viewportHeight;
          });

          blocks.forEach((element) => {
            if (element.scrollHeight > element.clientHeight + 6 && win.getComputedStyle(element).overflow !== "visible") {
              overfullBlocks.push({
                y,
                selector: shortSelector(element),
                clientHeight: element.clientHeight,
                scrollHeight: element.scrollHeight
              });
            }
          });

          for (let i = 0; i < blocks.length; i += 1) {
            const a = blocks[i];
            const rectA = a.getBoundingClientRect();
            for (let j = i + 1; j < blocks.length; j += 1) {
              const b = blocks[j];
              if (isParentChild(a, b)) {
                continue;
              }

              const rectB = b.getBoundingClientRect();
              if (overlaps(rectA, rectB)) {
                visibleOverlaps.push({
                  y,
                  a: shortSelector(a),
                  b: shortSelector(b),
                  aTop: Math.round(rectA.top),
                  bTop: Math.round(rectB.top)
                });
              }
            }
          }
        }

        const dedupe = (items, keyFn) => {
          const seen = new Set();
          return items.filter((item) => {
            const key = keyFn(item);
            if (seen.has(key)) {
              return false;
            }
            seen.add(key);
            return true;
          });
        };

        const result = {
          viewportWidth,
          viewportHeight,
          documentWidth: doc.documentElement.scrollWidth,
          bodyWidth: doc.body.scrollWidth,
          visibleOverflow: dedupe(visibleOverflow, (item) => `${item.selector}|${item.left}|${item.right}`).slice(0, 40),
          visibleOverlaps: dedupe(visibleOverlaps, (item) => `${item.a}|${item.b}|${item.y}`).slice(0, 40),
          overfullBlocks: dedupe(overfullBlocks, (item) => `${item.selector}|${item.clientHeight}|${item.scrollHeight}`).slice(0, 40)
        };

        out.textContent = JSON.stringify(result, null, 2);
      }

      runChecks();
    });
  </script>
</body>
</html>
